title: LSASS Access With Full Rights (as first written)
id: 9351402a-7061-413f-8e43-3641985df355
status: deprecated
description: |
    The detection from my original APT41 write-up, kept for comparison: alert when a
    process opens lsass.exe with "high/full access rights (e.g. 0x1F0FFF)".
    0x1F0FFF is PROCESS_ALL_ACCESS as defined before Windows Vista. On current Windows
    the same constant is 0x1FFFFF, and Mimikatz's sekurlsa module asks for only 0x1010.
    See the README for what this rule misses.
author: Gursimran Singh
date: 2026-11-02
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess: '0x1F0FFF'
    condition: selection
level: high
